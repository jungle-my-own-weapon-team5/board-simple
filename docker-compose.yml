services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-board}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-board}"
      POSTGRES_DB: "${POSTGRES_DB:-board}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data_pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-board}:${POSTGRES_PASSWORD:-board}@db:5432/${POSTGRES_DB:-board}}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:8080}"
      FRONTEND_EXTRA_ORIGINS: "${FRONTEND_EXTRA_ORIGINS:-http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      API_REQUEST_BODY_MAX_BYTES: "${API_REQUEST_BODY_MAX_BYTES:-262144}"
      AI_RAG_ENABLED: "${AI_RAG_ENABLED:-false}"
      AI_AGENT_PROVIDER: "${AI_AGENT_PROVIDER:-openai}"
      AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-openai}"
      AI_AGENT_MODEL: "${AI_AGENT_MODEL:-}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-}"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-60}"
      AI_AGENT_MAX_ITERATIONS: "${AI_AGENT_MAX_ITERATIONS:-12}"
      AI_AGENT_MAX_TOOL_CALLS: "${AI_AGENT_MAX_TOOL_CALLS:-5}"
      AI_AGENT_MAX_HANDOFFS: "${AI_AGENT_MAX_HANDOFFS:-8}"
      AI_AGENT_MAX_REPEATED_ACTIONS: "${AI_AGENT_MAX_REPEATED_ACTIONS:-2}"
      AI_AGENT_MAX_EXTERNAL_SYNC_CANDIDATES: "${AI_AGENT_MAX_EXTERNAL_SYNC_CANDIDATES:-3}"
      AI_RATE_LIMIT_PER_MINUTE: "${AI_RATE_LIMIT_PER_MINUTE:-20}"
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_PROMPT_VERSION: "${RAG_PROMPT_VERSION:-v1}"
      MCP_SERVER_ENABLED: "${MCP_SERVER_ENABLED:-false}"
      MCP_ALLOWED_TOOLS: "${MCP_ALLOWED_TOOLS:-search_legal_documents,search_law_open_api,verify_citations}"
      MCP_REQUEST_TIMEOUT_SECONDS: "${MCP_REQUEST_TIMEOUT_SECONDS:-30}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      LAW_OPEN_API_OC: "${LAW_OPEN_API_OC:-}"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: "${APP_ENV:-development}"
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-board}:${POSTGRES_PASSWORD:-board}@db:5432/${POSTGRES_DB:-board}}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-change-me}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:8080}"
      FRONTEND_EXTRA_ORIGINS: "${FRONTEND_EXTRA_ORIGINS:-http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000}"
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-false}"
      API_REQUEST_BODY_MAX_BYTES: "${API_REQUEST_BODY_MAX_BYTES:-262144}"
      AI_RAG_ENABLED: "${AI_RAG_ENABLED:-false}"
      AI_AGENT_PROVIDER: "${AI_AGENT_PROVIDER:-openai}"
      AI_EMBEDDING_PROVIDER: "${AI_EMBEDDING_PROVIDER:-openai}"
      AI_AGENT_MODEL: "${AI_AGENT_MODEL:-}"
      AI_EMBEDDING_MODEL: "${AI_EMBEDDING_MODEL:-}"
      AI_EMBEDDING_DIMENSIONS: "${AI_EMBEDDING_DIMENSIONS:-}"
      AI_REQUEST_TIMEOUT_SECONDS: "${AI_REQUEST_TIMEOUT_SECONDS:-60}"
      AI_AGENT_MAX_ITERATIONS: "${AI_AGENT_MAX_ITERATIONS:-12}"
      AI_AGENT_MAX_TOOL_CALLS: "${AI_AGENT_MAX_TOOL_CALLS:-5}"
      AI_AGENT_MAX_HANDOFFS: "${AI_AGENT_MAX_HANDOFFS:-8}"
      AI_AGENT_MAX_REPEATED_ACTIONS: "${AI_AGENT_MAX_REPEATED_ACTIONS:-2}"
      AI_AGENT_MAX_EXTERNAL_SYNC_CANDIDATES: "${AI_AGENT_MAX_EXTERNAL_SYNC_CANDIDATES:-3}"
      AI_RATE_LIMIT_PER_MINUTE: "${AI_RATE_LIMIT_PER_MINUTE:-20}"
      RAG_TOP_K: "${RAG_TOP_K:-5}"
      RAG_PROMPT_VERSION: "${RAG_PROMPT_VERSION:-v1}"
      MCP_SERVER_ENABLED: "${MCP_SERVER_ENABLED:-false}"
      MCP_ALLOWED_TOOLS: "${MCP_ALLOWED_TOOLS:-search_legal_documents,search_law_open_api,verify_citations}"
      MCP_REQUEST_TIMEOUT_SECONDS: "${MCP_REQUEST_TIMEOUT_SECONDS:-30}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_BASE_URL: "${GEMINI_BASE_URL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-}"
      LAW_OPEN_API_OC: "${LAW_OPEN_API_OC:-}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      INTERNAL_API_BASE_URL: "http://backend:8000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_started

  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started

volumes:
  postgres_data_pg17:
